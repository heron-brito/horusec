name: Scanner Governance

on:
  workflow_dispatch:
    inputs:
      skip_regression_tests:
        description: 'Skip the local image build and e2e regression run'
        type: boolean
        default: false
  workflow_call:
    inputs:
      skip_regression_tests:
        description: 'Skip the local image build and e2e regression run'
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write
  packages: read

concurrency:
  group: scanner-governance
  cancel-in-progress: false

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'heron-brito'
    env:
      # Exposed at job level so the notification step can check it in its `if`:
      # the secrets context is not available there.
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update scanner images
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional PAT with read:packages. Listing packages under a user
          # namespace usually rejects GITHUB_TOKEN; the script falls back to
          # GITHUB_TOKEN when this secret is not configured.
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail

          python3 deployments/scripts/update-scanner-images.py \
            --images-file internal/enums/images/images.go \
            --report-file .scanner-governance-report.md

          if git diff --quiet -- internal/enums/images/images.go; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish update summary
        run: |
          cat .scanner-governance-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Go
        if: steps.update.outputs.has_changes == 'true' && !inputs.skip_regression_tests
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download examples repository
        if: steps.update.outputs.has_changes == 'true' && !inputs.skip_regression_tests
        run: |
          git clone https://github.com/heron-brito/horusec-examples-vulnerabilities.git ../horusec-examples-vulnerabilities

      - name: Build local scanner images
        if: steps.update.outputs.has_changes == 'true' && !inputs.skip_regression_tests
        run: sh ./deployments/scripts/build-all-tools.sh

      - name: Run scanner regression tests
        if: steps.update.outputs.has_changes == 'true' && !inputs.skip_regression_tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HORUSEC_E2E_ONLY_LOCAL_IMAGES: "true"
          OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
          OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}
        run: go test -v ./e2e/analysis/... -timeout 60m -failfast -race

      - name: Create pull request
        id: pr
        if: steps.update.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(images): update scanner image versions"
          branch: "chore/scanner-governance"
          delete-branch: true
          title: "chore(images): update scanner image versions"
          body-path: ".scanner-governance-report.md"
          signoff: true

      # Skipped when the mail secrets are absent, so the workflow still works
      # for a fork that has not configured them.
      - name: Notify by email
        if: steps.pr.outputs.pull-request-url != '' && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: Horusec Scanner Governance <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO || secrets.MAIL_USERNAME }}
          subject: "[horusec] PR #${{ steps.pr.outputs.pull-request-number }}: novas versoes das imagens de scanner"
          html_body: |
            <p>O Scanner Governance abriu um PR de manutencao atualizando as versoes
            das imagens de scanner em <code>internal/enums/images/images.go</code>.</p>

            <p style="font-size:16px">
              <a href="${{ steps.pr.outputs.pull-request-url }}">
                Revisar e mesclar o PR #${{ steps.pr.outputs.pull-request-number }}
              </a>
            </p>

            <p>
              <a href="${{ steps.pr.outputs.pull-request-url }}/files">Ver so o diff</a>
              &middot;
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Ver a execucao</a>
            </p>

            <p>As imagens foram construidas e validadas pelo e2e antes de serem
            publicadas. O relatorio com as versoes anterior e nova segue em anexo.</p>
          attachments: .scanner-governance-report.md
