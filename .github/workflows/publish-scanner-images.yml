name: Publish Scanner Images

# Builds the 12 scanner images, validates them with the e2e analysis suite and
# only then publishes them to GHCR. The images that get pushed are the exact
# ones the tests ran against: several Dockerfiles install their tool unpinned
# (checkov, phpcs, shellcheck), so rebuilding after the tests would publish
# different bits than the ones validated.
#
# That guarantee is also why the scanners fan out over one NATIVE runner per
# architecture instead of one runner emulating the other. Each architecture
# builds its own bits, runs the suite against them and pushes them under an
# architecture suffix; `merge` then joins the two into the manifest list that
# `:VERSION` and `:latest` resolve to. Emulating arm64 on an amd64 runner would
# publish an image no test ever executed, and would take hours on the heavier
# images - the .NET SDK one above all.
#
# horusec-cli rides the same version, published from the same run once the
# scanners are up. That is the tag to pin: the alpha tag is rebuilt on every
# push to main, and the release pipelines only tag on a manual release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Ex: (v2.10.3). Leave empty to bump the patch automatically'
        required: false
      dry_run:
        description: 'Build and validate without publishing'
        type: boolean
        default: false
  schedule:
    # Daily. Three hours before the Scanner Governance cron, so a manual
    # governance run still finds the freshly published tags if the chained job
    # is skipped.
    - cron: "0 3 * * *"

# Ceiling for the whole workflow: a called workflow can only downgrade the
# caller's permissions, never elevate them. Each job narrows this down.
permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: publish-scanner-images
  cancel-in-progress: false

jobs:
  # Resolved once and handed to the other jobs. Two matrix legs each bumping
  # the patch on their own would race, and the disagreement would only surface
  # at the end, as a manifest list that cannot find one of its halves.
  version:
    name: resolve version
    runs-on: ubuntu-latest
    if: github.repository_owner == 'heron-brito'
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(python3 deployments/scripts/update-scanner-images.py \
              --ghcr-owner "${{ github.repository_owner }}" \
              --next-version)"
          fi

          # Scanner Governance only picks up stable vMAJOR.MINOR.PATCH tags.
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid version: $VERSION (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION" >> "$GITHUB_STEP_SUMMARY"

  build-validate-publish:
    name: build, validate and publish (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      # One architecture publishing without the other would leave a version
      # that cannot be assembled into a manifest list. Stopping both is the
      # honest outcome - `merge` never runs on half a release.
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download examples repository
        run: |
          git clone https://github.com/heron-brito/horusec-examples-vulnerabilities.git ../horusec-examples-vulnerabilities

      - name: Build local scanner images
        run: sh ./deployments/scripts/build-all-tools.sh

      - name: Run scanner regression tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Validate the images built above, not the ones already published:
          # those are precisely what this run is about to replace.
          HORUSEC_E2E_ONLY_LOCAL_IMAGES: "true"
          OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
          OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}
        run: go test -v ./e2e/analysis/... -timeout 60m -failfast -race

      - name: GHCR Login
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push validated images
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Pushed under an architecture suffix, never under the plain version:
          # `merge` is what makes `:$VERSION` resolve, and it must not resolve
          # to a single architecture in the meantime. The suffixed tags stay
          # afterwards - they are the only handle on one specific architecture
          # when a scan misbehaves on one and not the other.
          #
          # build-all-tools.sh tags images by the Dockerfile directory name,
          # which matches the GHCR repository for every language except
          # javascript, published as horusec-js.
          for PAIR in c:horusec-c csharp:horusec-csharp elixir:horusec-elixir \
                      generic:horusec-generic go:horusec-go hcl:horusec-hcl \
                      javascript:horusec-js leaks:horusec-leaks php:horusec-php \
                      python:horusec-python ruby:horusec-ruby shell:horusec-shell; do
            DIR="${PAIR%%:*}"
            REPO="${PAIR##*:}"

            docker tag "local-$DIR:local" "$REGISTRY/$REPO:$VERSION-$ARCH"
            docker push "$REGISTRY/$REPO:$VERSION-$ARCH"

            echo "- \`$REGISTRY/$REPO:$VERSION-$ARCH\`" >> "$GITHUB_STEP_SUMMARY"
          done

  merge:
    name: join the architectures
    needs: [version, build-validate-publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      published: ${{ steps.merge.outputs.published }}

    steps:
      - name: GHCR Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create the manifest lists
        id: merge
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # `imagetools create` assembles the list from images already in the
          # registry - it rebuilds nothing, so each architecture publishes
          # exactly the bits its own runner validated.
          for REPO in horusec-c horusec-csharp horusec-elixir horusec-generic \
                      horusec-go horusec-hcl horusec-js horusec-leaks \
                      horusec-php horusec-python horusec-ruby horusec-shell; do
            docker buildx imagetools create \
              --tag "$REGISTRY/$REPO:$VERSION" \
              --tag "$REGISTRY/$REPO:latest" \
              "$REGISTRY/$REPO:$VERSION-amd64" \
              "$REGISTRY/$REPO:$VERSION-arm64"

            echo "- \`$REGISTRY/$REPO:$VERSION\` (amd64 + arm64)" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "published=true" >> "$GITHUB_OUTPUT"

  cli:
    name: publish horusec-cli
    needs: [version, build-validate-publish, merge]
    # always() is what lets this run on a dry run, where `merge` is skipped and
    # a skipped dependency would otherwise skip this job too. The build itself
    # still has to be green: a dry run that never exercised this path is how
    # the CLI build would go untested until a real publish.
    if: >-
      ${{ always()
          && needs.build-validate-publish.result == 'success'
          && (inputs.dry_run || needs.merge.outputs.published == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The CLI image embeds internal/enums/images/images.go, which on main
      # still points at the previous release. Rewriting it here (in the working
      # tree only - the governance job below is what commits it) makes
      # horusec-cli:$VERSION run exactly the scanner images pushed above.
      - name: Pin the freshly published scanners into the CLI build
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail

          python3 deployments/scripts/update-scanner-images.py \
            --images-file internal/enums/images/images.go \
            --report-file /tmp/cli-image-pins.md

          git --no-pager diff -- internal/enums/images/images.go

      - name: Resolve build date
        id: build_date
        run: echo "date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: GHCR Login
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Gives the CLI a tag that is immutable and matches the scanners it
      # drives, so nothing has to pin the alpha tag - which is rewritten on
      # every push to main - just to get a recent build.
      #
      # This one stays on QEMU rather than a native matrix like the scanners:
      # it is a single Go binary on top of dind, minutes rather than hours, and
      # it has no per-architecture suite of its own to run.
      - name: Build and push horusec-cli
        id: push-cli
        uses: docker/build-push-action@v6
        with:
          push: ${{ !inputs.dry_run }}
          context: .
          file: ./deployments/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            CLI_VERSION=${{ needs.version.outputs.version }}
            CLI_COMMIT=${{ github.sha }}
            CLI_DATE=${{ steps.build_date.outputs.date }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/horusec-cli:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/horusec-cli:latest

      - name: Record the CLI image in the summary
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "- \`$REGISTRY/horusec-cli:$VERSION\` built for amd64 and arm64, not pushed (dry run)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- \`$REGISTRY/horusec-cli:$VERSION\` (also tagged \`latest\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

  governance:
    name: update images.go
    needs: [merge, cli]
    if: needs.merge.outputs.published == 'true'
    permissions:
      contents: write
      pull-requests: write
      packages: read
    uses: ./.github/workflows/scanner-governance.yml
    with:
      # The images were just built and validated by the jobs above.
      skip_regression_tests: true
    secrets: inherit
